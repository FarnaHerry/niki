# hui — a drag-and-drop HuxerUI designer with a CLI and an MCP server.
#
# An mcpp application in the HuxerUI template shape: one dependency line, the
# entry instantiates nothing, and huxerui.rules owns source selection and the
# composable transform. `standard = "c++23"` follows the template pin (see
# HuxerUI's templates/app/mcpp.toml.in for why).
[package]
name     = "hui"
version  = "0.1.0"
standard = "c++23"
description = "Drag-and-drop HuxerUI designer with CLI and MCP server"
license = "Apache-2.0"
repo    = "https://github.com/HuxerUI/HuxerUI"

[dependencies]
huxerui.huxerui = { path = "../HuxerUI" }

[targets.hui]
kind = "bin"
main = "src/main.cpp"

[build]
# huxerui.rules selects sources (src/**/*.cpp and src/**/*.cppm) and schedules
# the composable transform; a manifest glob here would double-link them.
sources = []
